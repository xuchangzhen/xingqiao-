plugins { id "com.android.application" }

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseValue = { name ->
    def key = name.replaceAll(/([a-z])([A-Z])/, '$1_$2').toUpperCase()
    keystoreProperties[name] ?: project.findProperty("XINGQIAO_${key}") ?: System.getenv("XINGQIAO_${key}")
}
def hasReleaseSigning = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every { releaseValue(it) }
def configuredWebUrl = (project.findProperty("XINGQIAO_DEFAULT_WEB_URL") ?: System.getenv("XINGQIAO_DEFAULT_WEB_URL") ?: "").toString().replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace "com.xingqiao.android"
    compileSdk 35
    defaultConfig {
        applicationId "com.xingqiao.android"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.2.1"
        buildConfigField "String", "DEFAULT_WEB_URL", "\"${configuredWebUrl}\""
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseValue("storeFile"))
                storePassword releaseValue("storePassword")
                keyAlias releaseValue("keyAlias")
                keyPassword releaseValue("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
